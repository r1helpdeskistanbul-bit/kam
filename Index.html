<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="KAM">
<title>KAM · Mikrolink R1 NOC</title>
<meta name="theme-color" content="#0e1116">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4l24 14v28L32 60 8 46V18z' fill='%230b0d12' stroke='%23ff3341' stroke-width='4'/%3E%3Cpath d='M24 18v28M24 32l14-14M28 29l12 17' stroke='%23ff3341' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;background:#0e1116;overflow:hidden}
  /* telefon çentiği ve alttaki ev çubuğu için boşluk */
  iframe{position:fixed;left:env(safe-area-inset-left);right:env(safe-area-inset-right);top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);width:calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right));height:calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));border:0;display:block}
  #off{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translateX(-50%);z-index:5;display:none;padding:8px 14px;border-radius:10px;background:#3a1218;border:1px solid #ff3341;color:#ffd7da;font:600 13px system-ui,sans-serif}
  body.off #off{display:block}
  /* "Uygulamayı indir" kartı: telefondan tarayıcıyla girince açılır */
  #kur{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translate(-50%,20px);z-index:6;width:min(380px,calc(100vw - 24px));box-sizing:border-box;display:none;gap:12px;align-items:center;padding:12px 12px 12px 14px;border-radius:16px;background:#141922;border:1px solid #ff3341;box-shadow:0 0 0 4px rgba(255,51,65,.15),0 12px 36px rgba(0,0,0,.55);color:#e9edf3;font:14px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:0;transition:.35s}
  #kur.ac{display:flex}#kur.gor{opacity:1;transform:translate(-50%,0)}
  #kur img{width:44px;height:44px;border-radius:11px;flex:none}
  #kur .t{flex:1;min-width:0;line-height:1.3}#kur .t b{display:block;font-size:15px}#kur .t span{font-size:12.5px;color:#9aa4b2}
  #kur .b{flex:none;border:0;border-radius:10px;padding:11px 14px;background:#ff3341;color:#fff;font-weight:700;font-size:14px;font-family:inherit;text-decoration:none;cursor:pointer}
  #kur .x{position:absolute;top:-10px;right:-6px;width:26px;height:26px;border-radius:50%;border:1px solid #39414d;background:#141922;color:#9aa4b2;font-size:16px;line-height:1;font-family:inherit;cursor:pointer}
  #kurY{position:fixed;inset:0;z-index:7;display:none;align-items:flex-end;justify-content:center;background:rgba(5,8,12,.6);font:15px system-ui,-apple-system,sans-serif;color:#e9edf3}
  #kurY.ac{display:flex}
  #kurY>div{width:min(460px,100%);box-sizing:border-box;background:#141922;border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));border-top:1px solid #39414d}
  #kurY h3{margin:0 0 12px;font-size:17px}#kurY ol{margin:0;padding-left:20px;line-height:1.7}#kurY b{color:#fff}
  #kurY button{margin-top:16px;width:100%;border:0;border-radius:12px;padding:12px;background:#ff3341;color:#fff;font-weight:700;font-size:15px;font-family:inherit}
</style>
</head>
<body>
<!-- KAM kabuğu: Apps Script uygulamasını tam ekran içine alır, Google'ın üstteki uyarı şeridi bu sayfada görünmez. -->

<div id="off">İnternet bağlantısı yok · bağlanınca KAM kendini yeniler</div>
<div id="kur"><img src="icon-192.png" alt=""><div class="t"><b>KAM uygulaması</b><span id="kurA">Telefonuna kur, tek dokunuşla aç</span></div><a class="b" id="kurB" href="#">İndir</a><button class="x" id="kurX" aria-label="Kapat">×</button></div>
<div id="kurY"><div><h3 id="kurYh">KAM'ı ana ekrana ekle</h3><ol id="kurYl"></ol><button id="kurYk">Tamam</button></div></div>
<iframe id="kam" allow="microphone; autoplay; fullscreen; clipboard-read; clipboard-write" allowfullscreen></iframe>
<script>
  var KAM_URL = 'https://script.google.com/macros/s/AKfycbzl5qoVwikiVvsv-vfm6tn4ZpSh0o55Z9rBKeuD4zfvL8JLJ8qP_zMmkAAAGuTmBRg5/exec';
  // ?site=K3294 gibi linkler aynen uygulamaya geçsin
  document.getElementById('kam').src = KAM_URL + location.search;

  // uygulama olarak kurulabilsin (Ana ekrana ekle)
  if ('serviceWorker' in navigator) window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  // bağlantı gidip gelirse uyar, geri gelince uygulamayı tazele
  var gitti = 0;
  var cevrim = function(){ document.body.classList.toggle('off', !navigator.onLine); };
  window.addEventListener('offline', function(){ gitti = Date.now(); cevrim(); });
  // kısa kopmalarda (asansör, tünel) yenileme yapma; 1 dakikadan uzun koptuysa tazele
  window.addEventListener('online', function(){ cevrim(); if (gitti && Date.now() - gitti > 60000) { var f = document.getElementById('kam'); f.src = f.src; } gitti = 0; });
  cevrim();

  // ---- "Uygulamayı indir" kartı ----
  // Android: varsa kam.apk indirilir (en garantisi), yoksa Chrome'un kendi yükleme penceresi açılır.
  // iPhone: Safari'de "Ana Ekrana Ekle" adımları gösterilir. Uygulama olarak açıldıysa kart hiç çıkmaz.
  (function(){
    var ua = navigator.userAgent, ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1), android = /Android/i.test(ua);
    var kurulu = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone || /^android-app:/.test(document.referrer);
    var ls = function(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e) { return null; } };
    if (kurulu || (!ios && !android)) return;
    var ertele = +ls('kam_kur_x') || 0; if (Date.now() - ertele < 3 * 864e5) return;
    var kart = document.getElementById('kur'), btn = document.getElementById('kurB'), alt = document.getElementById('kurA');
    var yard = document.getElementById('kurY'), yl = document.getElementById('kurYl');
    var istem = null, apk = false;
    function goster(){ kart.classList.add('ac'); setTimeout(function(){ kart.classList.add('gor'); }, 30); }
    function gizle(){ kart.classList.remove('gor'); setTimeout(function(){ kart.classList.remove('ac'); }, 350); }
    function adimlar(h, a){ document.getElementById('kurYh').textContent = h; yl.innerHTML = a.map(function(x){ return '<li>' + x + '</li>'; }).join(''); yard.classList.add('ac'); }
    document.getElementById('kurX').onclick = function(){ ls('kam_kur_x', String(Date.now())); gizle(); };
    document.getElementById('kurYk').onclick = function(){ yard.classList.remove('ac'); };
    window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); istem = e; });
    window.addEventListener('appinstalled', function(){ gizle(); });
    btn.onclick = function(e){
      if (apk) { setTimeout(function(){ adimlar('İndirme başladı', ['Bildirimlerden <b>kam.apk</b> dosyasına dokun.', '"Bilinmeyen uygulamalar" uyarısı çıkarsa <b>Ayarlar → Bu kaynaktan izin ver</b>.', '<b>Yükle</b> de, ana ekranda <b>KAM</b> simgesi belirir.']); }, 600); return; }
      e.preventDefault();
      if (ios) return adimlar('iPhone\'a kur', ['Safari\'nin altındaki <b>Paylaş</b> düğmesine (kare içinde yukarı ok) dokun.', 'Listeyi aşağı kaydırıp <b>Ana Ekrana Ekle</b>\'yi seç.', 'Sağ üstte <b>Ekle</b> de. Simge ana ekrana gelir.', 'Safari dışında (Chrome vb.) açtıysan bu adres Safari\'de açılmalı.']);
      if (istem) { istem.prompt(); istem.userChoice.then(function(r){ if (r && r.outcome === 'accepted') gizle(); istem = null; }); return; }
      adimlar('Telefona kur', ['Chrome\'da sağ üstteki <b>⋮</b> menüsüne dokun.', '<b>Ana ekrana ekle</b> → <b>Yükle</b> (yoksa <b>Kısayol oluştur</b>) seç.', 'Ana ekranda <b>KAM</b> simgesi belirir.']);
    };
    if (ios) { btn.textContent = 'Kur'; alt.textContent = 'Ana ekrana ekle, uygulama gibi aç'; setTimeout(goster, 2500); return; }
    // Android: depoda kam.apk varsa doğrudan indirme
    fetch('kam.apk', { method: 'HEAD', cache: 'no-store' }).then(function(r){
      if (r.ok) { apk = true; btn.href = 'kam.apk'; btn.setAttribute('download', 'kam.apk'); alt.textContent = 'Android uygulamasını indir · 1 dk'; }
    }).catch(function(){}).then(function(){ setTimeout(goster, 2500); });
  })();

  // Ses köprüsü: Google'ın iç çerçevesi mikrofonu engellediği için tanımayı bu sayfa yapar, metni KAM'a yollar.
  // tek: bas-konuş komutu · surekli: "KAM" uyandırma kelimesi için arka planda dinleme
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition, rec = null, mod = '', uyan = false, hedef = null, tekBekle = false, lang = 'tr-TR';
  var okKaynak = function(o){ return /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/i.test(o); };
  var yolla = function(x){ if (!hedef) return; x.kam = 'sr'; try { hedef.w.postMessage(x, hedef.o); } catch(e) {} };
  function surekliBasla(){
    if (!SR || !uyan || rec) return;
    var r = new SR(); rec = r; mod = 'surekli'; r.lang = lang; r.continuous = true; r.interimResults = false; r.maxAlternatives = 1;
    r.onresult = function(ev){ for (var i = ev.resultIndex; i < ev.results.length; i++) if (ev.results[i].isFinal) yolla({ t: 'surekli', text: ev.results[i][0].transcript }); };
    r.onerror = function(ev){ if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') { uyan = false; yolla({ t: 'uhata', err: 'not-allowed' }); } };
    r.onend = function(){ rec = null; mod = ''; if (tekBekle) { tekBekle = false; tekBasla(); } else if (uyan) setTimeout(surekliBasla, 400); };
    try { r.start(); } catch(x) { rec = null; mod = ''; }
  }
  function tekBasla(){
    if (!SR) { yolla({ t: 'error', err: 'desteklenmiyor' }); yolla({ t: 'end' }); return; }
    if (rec) { if (mod === 'surekli') { tekBekle = true; try { rec.abort(); } catch(x) {} return; } try { rec.abort(); } catch(x) {} }
    var r = new SR(); rec = r; mod = 'tek'; r.lang = lang; r.interimResults = true; r.maxAlternatives = 1;
    r.onstart = function(){ yolla({ t: 'start' }); };
    r.onresult = function(ev){ var t = ''; for (var i = 0; i < ev.results.length; i++) t += ev.results[i][0].transcript; yolla({ t: 'result', text: t, fin: ev.results[ev.results.length - 1].isFinal }); };
    r.onerror = function(ev){ yolla({ t: 'error', err: ev.error }); };
    r.onend = function(){ rec = null; mod = ''; yolla({ t: 'end' }); if (uyan) setTimeout(surekliBasla, 400); };
    try { r.start(); } catch(x) { rec = null; mod = ''; yolla({ t: 'error', err: 'baslamadi' }); yolla({ t: 'end' }); }
  }
  // oda ekranı: tam ekran + ekran uykuya geçmesin
  var kilit = null;
  function uyanikTut(){ try { if (navigator.wakeLock && !kilit) navigator.wakeLock.request('screen').then(function(l){ kilit = l; l.addEventListener('release', function(){ kilit = null; }); }).catch(function(){}); } catch(x) {} }
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible' && tamAcik) uyanikTut(); });
  var tamAcik = false;
  window.addEventListener('message', function(e){
    var m = e.data; if (!m || !m.kam || !okKaynak(e.origin)) return;
    hedef = { w: e.source, o: e.origin };
    if (m.kam === 'ping') { e.source.postMessage({ kam: 'pong', sr: !!SR }, e.origin); return; }
    if (m.lang) lang = m.lang;
    if (m.kam === 'dinle') return tekBasla();
    if (m.kam === 'dur') { if (rec && mod === 'tek') rec.stop(); return; }
    if (m.kam === 'uyan') { uyan = !!m.on && !!SR; if (uyan) surekliBasla(); else if (rec && mod === 'surekli') { try { rec.abort(); } catch(x) {} } return; }
    if (m.kam === 'tam') {
      tamAcik = !!m.on;
      if (m.on) { uyanikTut(); var f = document.getElementById('kam'); try { if (!document.fullscreenElement && f.requestFullscreen) f.requestFullscreen().catch(function(){}); } catch(x) {} }
      else { if (kilit) { try { kilit.release(); } catch(x) {} kilit = null; } try { if (document.fullscreenElement) document.exitFullscreen(); } catch(x) {} }
    }
  });
</script>
</body>
</html>
